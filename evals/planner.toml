# --- multi: more than one intent, in the order asked ------------------------------

[[case]]
id = "multi-show-then-tag"
group = "multi"
question = "Show my Airbnb charges and tag them Vacation"
expect = [
  { intent = "show_transactions", filter = { text = "airbnb" } },
  { intent = "propose_tag", tag_name = "Vacation", filter = { text = "airbnb" } },
]

[[case]]
id = "multi-two-merchants"
group = "multi"
question = "Tag the Delta and Marriott charges in October as Work trip"
expect = [
  { intent = "propose_tag", tag_name = "Work trip", filter = { text = "delta", start = 2026-10-01, end = 2026-10-31 } },
  { intent = "propose_tag", tag_name = "Work trip", filter = { text = "marriott", start = 2026-10-01, end = 2026-10-31 } },
]

[[case]]
id = "multi-two-summaries"
group = "multi"
question = "How much did I spend on the kids and on the wedding?"
expect = [
  { intent = "spending_summary", tag = "Kids" },
  { intent = "spending_summary", tag = "Wedding" },
]

[[case]]
id = "multi-file-then-tag"
group = "multi"
question = "File the Zola charges under Gifts and tag them Wedding"
expect = [
  { intent = "propose_category", category = "Gifts", filter = { text = "zola" } },
  { intent = "propose_tag", tag_name = "Wedding", filter = { text = "zola" } },
]
