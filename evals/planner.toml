# Goose's planner eval: run.py says how a case is scored.
#
# Every label and question here is made up, because the repo is public. A real
# question from a dev trace becomes a case only after it's rewritten with
# made-up names.
#
# `expect` is the plan a careful reader would make, given the labels below.
# - A field the case leaves out must be empty in the model's plan: a filter
#   nobody asked for is the commonest miss. The one exception is a summary's
#   `months`, which is the model's pick unless the question says.
# - A list gives every answer that counts: text = ["uber", "uber eats"].
# - For clarify, `options` lists the labels that must be among those offered.
# - An end date on or after today counts as no end date.

today = 2026-11-15  # a Sunday

[labels]
categories = [
  "Groceries", "Dining", "Coffee", "Rent", "Utilities", "Transport", "Shopping",
  "Subscriptions", "Travel", "Health", "Gifts", "Salary", "Emergency fund", "House down payment",
]
tags = ["PNW", "Work trip", "Wedding", "Kids"]
accounts = ["checking", "savings", "credit_card", "targeted"]  # A1, A2, A3, A4

# --- show: list what a filter matches ------------------------------------------

