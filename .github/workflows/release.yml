name: Release

# Bumping `version` in pyproject.toml is how a release happens. After CI
# passes on a push to main, this publishes a GitHub Release tagged
# v<version> if there isn't one yet, and friends with update checks on see
# "BlitZave <version> is ready". The release notes are that version's section
# of CHANGELOG.md; a version with no section isn't released. A merge that
# leaves the version alone releases nothing. Never publish releases by hand: a tag that doesn't match
# pyproject.toml would show that line forever.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish a release for a new version
    # Only a green CI run on a push to main, never a pull request's run.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish v<version> unless it's already released
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          # The app's update check only understands plain X.Y.Z.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pyproject.toml version '$version' must look like 1.2.3"
            exit 1
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            exit 0
          fi
          # The release notes are this version's CHANGELOG.md section, so a user
          # who updates reads what changed in plain words. No section, no
          # release: add one to CHANGELOG.md and merge again.
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v v="$version" '
            $1 == "##" { in_section = ($2 == v); next }
            in_section { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "CHANGELOG.md has no '## $version' section with notes in it."
            exit 1
          fi
          gh release create "v$version" --target "$HEAD_SHA" --title "BlitZave $version" --notes-file "$notes"
