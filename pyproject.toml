[project]
name = "blitzave"
version = "0.1.0"
description = "Self-hosted personal finance engine: syncs SimpleFIN, stores it in SQLite, serves a local API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
blitzave = "blitzave.__main__:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
