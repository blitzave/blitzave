[project]
name = "blitzave"
version = "0.1.1"
description = "A calm, open-source personal finance app that runs on your own laptop."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
keywords = ["personal-finance", "budgeting", "self-hosted", "local-first", "simplefin"]
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://blitzave.github.io/blitzave/"
Repository = "https://github.com/blitzave/blitzave"
Issues = "https://github.com/blitzave/blitzave/issues"

[project.scripts]
blitzave = "blitzave.__main__:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
